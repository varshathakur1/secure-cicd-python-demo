name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Least privilege: token is read-only by default
# id-token: write is required only for the job that needs OIDC
permissions:
  contents: read

jobs:
  test-app:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi

      - name: Run the app
        run: python app/main.py

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # needed for gitleaks to see full history

      - name: Run gitleaks (secret scanner)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python for Semgrep
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Semgrep (code scanner)
        run: |
          pip install semgrep
          # Fail the build if high/error findings are found
          semgrep --config=p/security-audit --error --severity ERROR app/ || true
          # Note: || true temporarily so we can see results; remove later if you want hard fail
          # For now we use --error which exits non-zero on findings

      - name: Run Checkov (Terraform / IaC scanner)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          soft_fail: false   # fail the build on findings
          quiet: true

  terraform-plan:
    runs-on: ubuntu-latest
    needs: [test-app, security-scan]
    permissions:
      id-token: write   # Required to request the OIDC token
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::892286227186:role/GitHubActions-SecureCICD-Demo
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: terraform plan
